# ── ARKANA GATEWAY + n8n reverse proxy (TLS termination) ──
# Domain: gateway.arkana.dev  (A record -> 10.10.0.10)
# sslh demuxes :443 TLS -> nginx :9444
#   /            -> gateway  (127.0.0.1:5011)
#   /n8n         -> n8n      (127.0.0.1:5678)
limit_req_zone $binary_remote_addr zone=arkana:10m rate=20r/s;
server {
    listen 8443 ssl http2;
    server_name gateway.arkana.dev;
    ssl_certificate     /etc/nginx/ssl/gateway.arkana.dev/gateway.arkana.dev.crt;
    ssl_certificate_key /etc/nginx/ssl/gateway.arkana.dev/gateway.arkana.dev.key;
    ssl_trusted_certificate /etc/nginx/ssl/gateway.arkana.dev/ca_bundle.crt;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 50m;
    # ── n8n (under /n8n) ──
    location ^~ /n8n/ {
        proxy_pass http://127.0.0.1:5678/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }
    # ── Gateway API + Blazor dashboard ──
    location / {
        limit_req zone=arkana burst=40 nodelay;
        proxy_pass http://127.0.0.1:5011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }
}
